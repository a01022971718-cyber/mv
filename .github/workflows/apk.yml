# 安卓安装包：开发者模式里「发布成 App」以后，自动把那个客户端打成 .apk，放到 GitHub 的 Releases 里（标签 apk-<客户端名>）。
# 每次发新版（version.json 变了）、或者改了打包脚本、这个文件时，打一个完整游戏的安装包（apk-dev）。也可以在 Actions 页面手动运行。
name: 安卓安装包
on:
  push:
    paths: ['game/apps/*/game.json', 'game/tools/build_apk.sh', '.github/workflows/apk.yml', 'game/version.json']
  workflow_dispatch:
    inputs:
      app: { description: '客户端名字（game/apps 下的文件夹）；留空打包完整游戏', required: false, default: '' }
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: 要打包哪些
        id: pick
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then A="${{ github.event.inputs.app }}"; [ -z "$A" ] && A=dev;
          else A=$(git diff --name-only HEAD~1 HEAD -- 'game/apps/*/game.json' | cut -d/ -f3 | sort -u | tr '\n' ' ');
               git diff --name-only HEAD~1 HEAD | grep -qE '^(game/tools/build_apk.sh|.github/workflows/apk.yml|game/version.json)$' && A="$A dev"; fi
          echo "apps=$(echo $A)" >> "$GITHUB_OUTPUT"; echo "要打包：$A"
      - name: 装工具
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick rsync >/dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: 打包
        env:
          OUT: ${{ github.workspace }}/apk-out
        run: for a in ${{ steps.pick.outputs.apps }}; do bash game/tools/build_apk.sh "$a"; done
      - name: 放到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in apk-out/*.apk; do a=$(basename "$f" .apk)
            gh release delete "apk-$a" -y --cleanup-tag >/dev/null 2>&1 || true
            gh release create "apk-$a" "$f" --target "$GITHUB_SHA" --title "安卓安装包：$a" --notes "用手机下载这个 .apk 文件，点开安装（第一次要允许「安装未知应用」）。生成于 $(date -u +%F)。"
          done
