/* 竖屏单屏游戏：状态条 / 整宽场景画布 / 面板 / 底部四个页签。
   一个固定的像素世界：2px = 1 个美术像素；所有颜色取自脚本里的 40 色主色板 PAL（暗部偏冷、亮部偏暖）。
   中文用 12px 像素字体（18px = 1.5 倍、24px = 2 倍），英文和数字用 Jersey 10（20 / 30 / 40px）。 */
:root{
  --ink:#150f20; --ink2:#6b5b6e; --paper:#f4e4c1; --paper2:#d8bf94; --paper-hi:#fffaf0; --line:#a38b78;
  --bg:#150f20; --bg2:#241b33; --tab:#3d3150;
  --gold:#ffb33a; --green:#8fd14f; --blue:#5cb8ee; --red:#e8423f; --red-dk:#a6283a; --salmon:#ff8a6b; --yellow:#ffe066; --navy:#3a7fd0;
  --ok:#8fd14f; --part:#ffe066; --miss:#ff8a6b;
  --px:2px;
  --f-ui:"Doudou Pixel CJK","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-en:"Jersey 10","Doudou Pixel CJK",ui-monospace,monospace;
  --pb:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink);
  --oct:polygon(18.18% 0,81.82% 0,81.82% 4.55%,90.91% 4.55%,90.91% 9.09%,95.45% 9.09%,95.45% 18.18%,100% 18.18%,100% 81.82%,95.45% 81.82%,95.45% 90.91%,90.91% 90.91%,90.91% 95.45%,81.82% 95.45%,81.82% 100%,18.18% 100%,18.18% 95.45%,9.09% 95.45%,9.09% 90.91%,4.55% 90.91%,4.55% 81.82%,0 81.82%,0 18.18%,4.55% 18.18%,4.55% 9.09%,9.09% 9.09%,9.09% 4.55%,18.18% 4.55%);
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;font-family:var(--f-ui);font-size:18px;line-height:1.5;font-weight:400;font-synthesis:none;color:var(--paper);
  background-color:var(--bg);
  background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%),linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;
  -webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
b,strong,h2,h3{font-weight:400}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle;flex:none}
.px{background:var(--paper);color:var(--ink);box-shadow:var(--pb);margin:2px}
h2,h3{margin:0;text-wrap:balance}
.en{font-family:var(--f-en)}
.num{font-family:var(--f-en);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.stack{display:grid;gap:14px;align-content:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* 按钮：最小 44×44 触控区；主次靠颜色区分，「跳过」之类用文字链接 */
.btn{font:inherit;font-size:18px;line-height:1.2;color:var(--ink);background:var(--gold);border:0;padding:4px 14px;min-height:44px;min-width:44px;margin:2px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;
  box-shadow:var(--pb),inset 0 -4px 0 0 rgba(21,15,32,.2),inset 0 2px 0 0 rgba(255,250,240,.45)}
.btn:active{transform:translateY(2px);box-shadow:var(--pb),inset 0 4px 0 0 rgba(21,15,32,.2)}
.btn:focus-visible,.link:focus-visible,#tabs button:focus-visible,.w:focus-visible,.seg button:focus-visible{outline:2px solid var(--paper-hi);outline-offset:4px}
.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.ghost{background:var(--paper2)}.btn.red{background:var(--salmon)}
.btn:disabled{background:var(--paper2);color:var(--ink2);cursor:not-allowed;transform:none;box-shadow:var(--pb)}
.link{font:inherit;font-size:18px;background:none;border:0;color:var(--ink2);text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 6px;cursor:pointer}
.eyebrow{margin:0;font-size:18px;color:var(--ink2)}

/* 状态条 */
#hud{padding-top:8px;padding-bottom:8px}
.hud-in{display:flex;align-items:center;gap:10px;padding:4px 8px}
.lvbox{flex:1;min-width:0;display:grid;gap:2px}
.lvline{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-en);font-size:20px;line-height:1}
.xpbar{height:10px;background:var(--paper2);box-shadow:0 0 0 2px var(--ink);margin:2px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(var(--green) 60%,#4fa83d 60%);transition:width .3s steps(6)}
.coins{display:flex;align-items:center;gap:6px;font-family:var(--f-en);font-size:30px;line-height:1}
.coins.bump{animation:bump .35s steps(3)}
@keyframes bump{50%{transform:scale(1.2)}}

/* 场景：整宽画布，按 2px 整数倍放大 */
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:16px;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
.view{display:grid;gap:14px;align-content:start}
.scene{position:relative;line-height:0;background:var(--bg2);overflow:hidden}
canvas.cv{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;line-height:1.3}
.float{position:absolute;transform:translate(-50%,-100%);font-size:18px;color:var(--paper-hi);white-space:nowrap;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink);animation:floatUp 1.2s steps(10) forwards}
.float.info{color:var(--yellow)}
.float.say{background:var(--paper-hi);color:var(--ink);text-shadow:none;padding:4px 8px;box-shadow:var(--pb);animation:sayIn 2.6s steps(6) forwards}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-100%)}to{opacity:0;transform:translate(-50%,-260%)}}
@keyframes sayIn{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}

/* 农场状态：图标 + 数字，和地块头顶的气泡同一套图标 */
.status{display:flex;flex-wrap:wrap;gap:8px;min-height:36px;align-items:center}
.st{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;background:var(--bg2);color:var(--paper);box-shadow:0 0 0 2px var(--tab)}
.st .num{font-size:20px;line-height:1}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools .btn{white-space:nowrap}
.tools #bHarvest{grid-column:1/-1}
.panel{padding:12px 14px;display:grid;gap:10px}
.panel h2{font-size:24px;line-height:1.2;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 small{font-size:18px;color:var(--ink2)}
.panel p{margin:0}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.qlist li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;min-height:48px}
.qbar{font-family:var(--f-en);font-size:20px;color:var(--ink2)}
.intro ol{margin:0;padding-left:24px;display:grid;gap:4px}
.bar{height:14px;background:var(--paper2);box-shadow:0 0 0 2px var(--ink);margin:2px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s steps(4)}
.vhead{display:grid;gap:4px;padding-top:4px}
.vhead h2{font-size:24px;line-height:1.2;color:var(--paper-hi)}
.vhead h2 span{font-family:var(--f-en);font-size:30px;color:var(--gold);margin-left:8px}
.vhead p{margin:0;color:var(--paper2)}
.cards{display:grid;gap:14px}

/* 菜谱卡片 */
.rc{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;padding:12px}
.rc h3{font-family:var(--f-en);font-size:30px;line-height:1}
.rc .sub{margin:4px 0 8px;color:var(--ink2)}
.rc-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 2px;background:var(--paper2)}
.chip.ok{background:#b9e08a}.chip.lack{background:var(--miss)}
.price{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-en);font-size:30px;line-height:1}
.need{color:var(--red-dk)}
.rc.locked{background:var(--paper2)}
.rc.locked h3,.rc.locked .sub{color:#3d3150}

/* 客人 */
.cc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px}
.cc p{margin:0}
.cc .name{font-family:var(--f-en);font-size:30px;line-height:1}
.empty{padding:14px}

/* 词本 */
.wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.wsum b{display:block;font-family:var(--f-en);font-size:40px;line-height:1}
.wsum span{color:var(--ink2)}
.wsum .btn{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:0;box-shadow:var(--pb);margin:2px;background:var(--paper2)}
.seg button{flex:1;font:inherit;font-size:18px;border:0;background:transparent;color:var(--ink);min-height:44px;padding:0 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold)}
.seg button+button{box-shadow:inset 2px 0 0 0 var(--ink)}
.wlist{padding:2px 12px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--paper2)}
.wrow:last-child{border-bottom:0}
.wrow .t{font-family:var(--f-en);font-size:30px;line-height:1;display:flex;align-items:center;gap:8px}
.wrow .meta{color:var(--ink2)}
.ipa{font-family:"Lucida Sans Unicode","Arial Unicode MS",system-ui,sans-serif;font-size:16px}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.tag{display:inline-block;padding:0 8px;background:var(--paper2);color:var(--ink)}
.locked-note{padding:8px 0;color:var(--ink2)}

/* 底部页签 */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:6px;padding-bottom:10px}
#tabs button{position:relative;font:inherit;font-size:18px;line-height:1.2;color:var(--paper);background:var(--tab);border:0;cursor:pointer;
  display:grid;justify-items:center;gap:2px;padding:6px 0;min-height:60px;box-shadow:var(--pb);margin:2px}
#tabs button[aria-selected=true]{background:var(--gold);color:var(--ink)}
.badge{position:absolute;top:-8px;right:0;min-width:24px;height:24px;padding:0 4px;background:var(--red-dk);color:var(--paper-hi);font-family:var(--f-en);font-size:20px;line-height:24px;text-align:center;box-shadow:0 0 0 2px var(--ink);font-style:normal}

/* 弹层：底部抽屉 / 居中对话框 / 全屏流程（顶栏 + 场景 + 内容 + 固定在拇指区的操作栏） */
.layer{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(21,15,32,.72);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.layer.center{align-items:center}
.sheet{width:100%;max-width:460px;max-height:100%;overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start}
.sheet h3{font-size:24px;line-height:1.25}
.sheet .lead{margin:0;color:var(--ink2)}
.layer.full{padding:0;background:var(--bg)}
.layer.full .sheet{max-width:480px;height:100%;max-height:none;padding:0;margin:0;box-shadow:none;display:flex;flex-direction:column;gap:0;overflow:hidden}
.fl-head{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px}
.fl-head .t{font-family:var(--f-en);font-size:30px;line-height:1}
.fl-head .s{color:var(--ink2)}
.pips{display:flex;gap:4px;grid-column:1/-1}
.pips i{flex:1;height:10px;background:var(--paper2)}
.pips i.done{background:var(--green)}.pips i.now{background:var(--gold)}
.fl-scene{line-height:0;background:var(--bg2)}
.fl-body{flex:1;min-height:0;overflow-y:auto;padding-top:14px;padding-bottom:14px;display:grid;gap:14px;align-content:start}
.fl-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--paper);box-shadow:inset 0 2px 0 0 var(--paper2)}
.fl-foot .btn{min-width:140px}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 10px;background:var(--paper2);color:var(--ink);text-align:left}
.li .meta{color:#3d3150}
.li .en{font-size:20px}
.li.off{background:transparent;box-shadow:inset 0 0 0 2px var(--paper2)}
.sec{color:var(--ink2);margin:4px 0 -6px}
.big{display:grid;justify-items:center;gap:8px;text-align:center;padding:6px 0}
.big h3{font-size:24px}
.big p{margin:0}

/* 口语卡：句子里每个词都能点着听；大号麦克风键带实时音量；原速 / 逐词是次级按钮 */
.speak{display:grid;gap:12px;padding:14px;background:var(--paper-hi);box-shadow:inset 0 0 0 2px var(--paper2)}
.sp-en{font-family:var(--f-en);font-size:30px;line-height:40px;color:var(--ink);display:flex;flex-wrap:wrap;gap:2px 8px;-webkit-user-select:text;user-select:text}
.sp-en .w{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0 4px;cursor:pointer;min-height:40px}
.sp-en .w.v{box-shadow:inset 0 -4px 0 0 var(--navy)}
.sp-en .w.ok{background:var(--ok);box-shadow:none}
.sp-en .w.part{background:var(--part);box-shadow:none}
.sp-en .w.miss{background:var(--miss);box-shadow:none;text-decoration:underline wavy var(--red-dk) 2px;text-underline-offset:6px}
.sp-en .w.cur{background:var(--blue)}
.sp-zh{color:var(--ink2)}
.sp-tools{display:flex;gap:10px;flex-wrap:wrap}
.sp-tools .btn{background:var(--blue)}
.sp-mic{display:grid;justify-items:center;gap:8px;padding-top:4px}
.mic{position:relative;width:96px;height:96px;border:0;padding:0;background:var(--ink);clip-path:var(--oct);cursor:pointer}
.mic .face{position:absolute;inset:4px;background:var(--red);clip-path:var(--oct);overflow:hidden}
.mic .lv{position:absolute;left:0;right:0;bottom:0;height:calc(var(--lv,0) * 100%);background:var(--salmon);transition:height .06s linear}
.mic .pix{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.mic.on .face{background:var(--red-dk)}
.mic.busy .face{background:var(--tab)}
.mic.self .face{background:var(--green)}
.mic:disabled{cursor:wait}
.mic:active .face{transform:translateY(2px)}
.sp-state{color:var(--ink2);text-align:center;min-height:27px;-webkit-user-select:text;user-select:text}
.sp-res{display:flex;align-items:center;justify-content:center;gap:10px;min-height:36px}
.sp-res:empty{display:none}
.sp-res .num{font-size:30px}
.sp-dl,.sp-self{display:grid;gap:8px;color:var(--ink2)}
.sp-dl p,.sp-self p{margin:0}

/* 小馆对话 */
.chat{display:grid;gap:10px}
.bub{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.bub .txt{padding:8px 10px;background:var(--paper-hi);box-shadow:inset 0 0 0 2px var(--paper2);display:grid;gap:4px}
.bub .txt p{margin:0}
.bub .e{font-family:var(--f-en);font-size:30px;line-height:1.1;color:var(--ink)}
.bub .z{color:var(--ink2)}
.bub.me{grid-template-columns:1fr auto}
.bub.me .txt{background:#e4f5c8;box-shadow:inset 0 0 0 2px #8fd14f}
.react{display:inline-flex;align-items:center;gap:4px;color:var(--ink2)}

#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(88vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:8px 12px;box-shadow:0 -2px 0 0 var(--gold),0 2px 0 0 var(--gold),-2px 0 0 0 var(--gold),2px 0 0 0 var(--gold);animation:sayIn 2.8s steps(6) forwards}
@media (prefers-reduced-motion:reduce){.float,.toast{animation-duration:.01s;animation-delay:2s}.coins.bump{animation:none}.mic .lv{transition:none}}

<script>
'use strict';

// ================= 主色板与像素绘图工具 =================
// 40 色主色板：每种材质 3–5 级色阶，暗部偏冷（往紫蓝走）、亮部偏暖（往黄走）。

  g0: '#d4f07a', g1: '#8fd14f', g2: '#4fa83d', g3: '#2e7a3a', g4: '#1d4f3a',
  w0: '#e8b37a', w1: '#c27d4a', w2: '#8f5233', w3: '#5c3424', w4: '#3a2122',
  r0: '#ff8a6b', r1: '#e8423f', r2: '#a6283a', r3: '#6b1d33',
  y0: '#fff3a3', y1: '#ffe066', y2: '#ffb33a', y3: '#f27b28', y4: '#c8501e',
  s0: '#e6f8ff', s1: '#a6e3fa', s2: '#5cb8ee', s3: '#3a7fd0', s4: '#2a4f9c', s5: '#22306a',
  p0: '#f7a3c4', p1: '#c45ea8', p2: '#7a3a8a',
  k0: '#fff1d6', k1: '#f2c9a0', k2: '#d9967a',
  m0: '#c3cad8', m1: '#8a94aa', m2: '#5b6378',

const PAL_LIST = Object.values(PAL);
const C = {
  ink: PAL.n7, white: PAL.n0,
  grass: PAL.g1, grass2: PAL.g2, grass3: PAL.g0, grassDk: PAL.g3,
  soil: PAL.w2, soil2: PAL.w3, soilEdge: PAL.w4, wet: PAL.w3, wet2: PAL.w4,
  leaf: PAL.g2, leaf2: PAL.g3, leafHi: PAL.g1, stem: PAL.g3,
  tomato: PAL.r1, tomato2: PAL.r2, carrot: PAL.y3, carrot2: PAL.y4,
  potato: PAL.w0, potato2: PAL.w1, corn: PAL.y1, corn2: PAL.y2, husk: PAL.g0,
  onion: PAL.n1, onion2: PAL.p1, berry: PAL.r1, berry2: PAL.r2,
  pumpkin: PAL.y3, pumpkin2: PAL.y4, egg: PAL.k0, egg2: PAL.n2,
  wood: PAL.w1, wood2: PAL.w2, wood3: PAL.w0, roof: PAL.r1, roof2: PAL.r2,
  tofu: PAL.k0, tofu2: PAL.k1, tofuTop: PAL.n0, limb: PAL.n2, blush: PAL.p0, scal: PAL.g1, scal2: PAL.g3,

const SNAP = new Map();
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
// 最近色（红均值加权的 RGB 距离，比直接欧氏距离更接近人眼）
function snap(col) {
  if (typeof col !== 'string' || col[0] !== '#' || col.length !== 7) return col;
  let s = SNAP.get(col); if (s) return s;
  const [r, g, b] = hexRGB(col); let bd = Infinity;

function E(g, cx, cy, rx, ry, col) {
  g.fillStyle = snap(col);
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry); y++)
    for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx); x++) {
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) g.fillRect(x, y, 1, 1);
    }
}
// Bresenham 线，w = 方形笔宽
function L(g, x0, y0, x1, y1, col, w = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, o = Math.floor((w - 1) / 2);

    g.fillRect(x0 - o, y0 - o, w, w);

// 多边形扫描填充（等距方块的墙面、屋顶用）
function poly(g, pts, col) {

function mat(g, x, y, rows, map) { rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== '.' && map[ch]) P(g, x + i, y + j, map[ch]); })); }

  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h).data, a = i => d[i * 4 + 3] > 0, add = [];

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function dpick(x, y, t, a, b) { return t * 16 > BAYER[(y & 3) * 4 + (x & 3)] + .5 ? b : a; }
// 天空：两色之间分几条平涂色带，只在交界处抖动；中间色也吸附到色板
function skyFill(g, x0, y0, w, h, cols) {
  const n = cols.length;
  for (let y = 0; y < h; y++) {
    const t = y / Math.max(1, h - 1) * (n - 1), k = Math.min(n - 2, Math.floor(t)), f = t - k;

function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function box(g, x, y, w, h, col) { R(g, x - 1, y - 1, w + 2, h + 2, C.ink); R(g, x, y, w, h, col); }
// 接地阴影：半透明的墨色椭圆，让角色和道具站在地上
function shadow(g, cx, cy, rx, ry = 2, a = .28) { g.save(); g.globalAlpha = a; E(g, cx, cy, rx, ry, C.ink); g.restore(); }
// 精灵缓存：同一个 key 只画一次；sprite() 留 1px 边给描边
const SPR = new Map();
function spr(k, fn) { let s = SPR.get(k); if (!s) { s = fn(); SPR.set(k, s); } return s; }

const UNIT = 2;
function fitCanvas(cv, H, minW = 160) {
  const css = cv.parentElement.clientWidth || 320, W = Math.max(minW, Math.floor(css / UNIT));
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; }

    finally { listening = false; mic.classList.remove('on', 'busy'); mic.style.setProperty('--lv', 0); if (!state.textContent) idle(); }

}

function entries() {

  const vlv = {}; RECIPES.forEach(r => r.steps.forEach(s => { const v = s.v.toLowerCase(); if (vlv[v] === undefined || r.lv < vlv[v]) vlv[v] = r.lv; }));
  Object.entries(VERB_INFO).forEach(([w, [ipa, zh]]) => push({ k: w, en: w, zh, ipa, cat: 'verb', lv: vlv[w] || 1 }));
  CROP_IDS.forEach(id => { const c = CROPS[id]; push({ k: c.say.en, en: c.say.en, zh: c.say.zh, cat: 'sent', lv: c.lv, v: c.en }); });
  RECIPES.forEach(r => r.steps.forEach(s => push({ k: s.en, en: s.en, zh: s.zh, cat: 'sent', lv: r.lv, v: s.v })));

function drill() {
  const pool = entries().filter(e => e.lv <= S.lv), pickd = [];
  const weight = e => 110 - ((S.words[e.k] || {}).b || 0);
  while (pickd.length < 5 && pickd.length < pool.length) {
    const rest = pool.filter(e => !pickd.includes(e)), tot = rest.reduce((a, e) => a + weight(e), 0); let x = Math.random() * tot;
    for (const e of rest) { x -= weight(e); if (x <= 0) { pickd.push(e); break; } }
  }
  practice(pickd, '快速练习 ×5');
}

// 农场状态：和地块头顶的气泡同一套图标
function renderFarmStatus() {
  const cnt = {}; S.plots.forEach(p => { const n = plotNeed(p); if (n && n !== 'lock') cnt[n] = (cnt[n] || 0) + 1; });
  const grow = S.plots.filter(p => p.open && p.crop && p.prog < growMs(p.crop)).map(p => ({ id: p.crop, s: (growMs(p.crop) - p.prog) / plotRate(p) / 1000 })).sort((a, b) => a.s - b.s)[0];
  const chips = ['ripe', 'bug', 'weed', 'dry', 'dead', 'empty'].filter(k => cnt[k]).map(k => `<span class="st" title="${NEED_ZH[k]}">${icImg(k)}<span class="num">${cnt[k]}</span>${NEED_ZH[k]}</span>`);
  if (S.nest.eggs) chips.push(`<span class="st">${itemImg('egg')}<span class="num">${S.nest.eggs}</span>鸡蛋</span>`);
  if (grow) chips.push(`<span class="st">${icImg('clock')}${CROPS[grow.id].zh}<span class="num">${fmtT(grow.s).replace(' 秒', 's')}</span></span>`);
  $('#farmStatus').innerHTML = chips.join('') || '<span class="muted">一切正常</span>';
  const hb = $('#bHarvest'), n = cnt.ripe || 0; hb.hidden = !n; if (n) hb.innerHTML = `${icImg('ripe')}一键收获 <span class="num">×${n}</span>`;
}
// 离线口语开通卡：第一次打开时就做好麦克风授权和模型下载，而不是做菜做到一半才弹
function renderSetup() {
  const el = $('#setup'), show = VIEW === 'farm' && !asrEmbedded() && !asrSaved() && !S.asrSkip && S.cfg.mode !== 'self' && !MIC.blocked;
  if (!show && ASR.state !== 'loading') { el.hidden = true; return; }
  el.hidden = false;
  const loading = ASR.state === 'loading', err = ASR.state === 'error';
  el.innerHTML = `<h2>开启离线口语评分 ${loading ? `<small class="num">${ASR.phase === 'download' ? ASR.pct + '%' : ''}</small>` : ''}</h2>
    <p>需要麦克风权限，并下载一次英文语音模型（约 40MB，建议连 Wi-Fi）。之后断网也能评分，录音不出手机。</p>
    ${loading || err ? `<div class="bar"><i style="width:${ASR.phase === 'download' ? ASR.pct : loading ? 100 : 0}%"></i></div><p class="muted">${asrLabel()}</p>` : ''}
    ${loading ? '' : `<div class="row between"><button class="link" type="button" data-a="setup-skip">以后再说</button><button class="btn green" type="button" data-a="setup-go">${err ? '重试' : '开启'}</button></div>`}`;
}
async function startSetup() {
  ac(); unlockVoice();
  try { await getMic(); } catch (e) { MIC.blocked = true; toast('拿不到麦克风，口语会改成跟读自评'); renderSetup(); return; }
  loadASR().then(() => { toast('离线口语评分已开启'); SFX.lvl(); refresh(); }, () => { });
}
function renderQuests() {
  ensureQuests();
  $('#quests').innerHTML = `<h2>今日任务 <small>每天零点刷新</small></h2><ul class="qlist">${S.q.list.map((q, i) => `<li><span>${QDEF[q.id].zh}</span><span class="qbar">${q.n}/${q.goal}</span>${q.done ? '<span class="tag">已领</span>' : `<button class="btn${q.n >= q.goal ? ' green' : ''}" type="button" data-q="${i}"${q.n >= q.goal ? '' : ' disabled'}>${uiImg('coin')}<span class="num">${10 + q.goal * 4}</span></button>`}</li>`).join('')}</ul>`;
}
function renderIntro() {
  const el = $('#intro'); el.hidden = !S.intro; if (!S.intro) return;
  el.innerHTML = `<h2>玩法 <button class="link" type="button" data-a="intro-x">知道了</button></h2><ol>
    <li>点地块：头顶的气泡告诉你该做什么（收获、捉虫、除草、浇水），点一下就做。</li>
    <li>去厨房做菜：每一步说出英文做法，平均星级决定菜的品质和价格。</li>
    <li>在小馆接待客人：听懂点单，用英语回答和报价，说得好还有小费。</li></ol>
    <p class="muted">每句英文都能点着听：「原速」读整句，「逐词」一个词一个词读，也可以直接点某个词。</p>`;
}
function renderKitchen() {
  $('#recipes').innerHTML = RECIPES.map(r => {
    const lock = r.lv > S.lv, ok = canCook(r), n = dishCount(r.id);
    const chips = Object.entries(r.need).map(([k, m]) => { const have = S.inv[k] || 0; return `<span class="chip ${lock ? '' : have >= m ? 'ok' : 'lack'}">${itemImg(k, 2)}<span class="num">×${m}</span>${lock ? '' : have >= m ? ` 有${have}` : ` 差${m - have}`}</span>`; }).join('');
    const lack = Object.entries(r.need).filter(([k, m]) => (S.inv[k] || 0) < m).map(([k, m]) => `${ITEMS[k].zh} ${m - (S.inv[k] || 0)}`).join('、');
    return `<article class="rc px${lock ? ' locked' : ''}">${dishImg(r.id, 2)}<div><h3 lang="en">${esc(r.en)}</h3><p class="sub">${r.zh} · ${r.steps.length} 句英文${n ? ` · 库存 ${n}` : ''}</p><div class="chips">${chips}</div></div>
      <div class="rc-foot">${coinHTML(r.price)}${lock ? `<span class="tag">Lv ${r.lv} 解锁</span>` : ok ? `<button class="btn green" type="button" data-cook="${r.id}">做菜</button>` : `<span class="need">还差 ${lack}</span>`}</div></article>`;
  }).join('');
}
let custSig = '';
function renderDiner() {
  custSig = S.cust.map(c => c.id + ':' + dishCount(c.dish)).join(',');
  $('#custList').innerHTML = S.cust.length ? S.cust.map(c => {
    const k = CRITTERS[c.who], r = RECIPE[c.dish], n = dishCount(c.dish);
    return `<article class="cc px">${critImg(c.who, 2)}<div><span class="name">${k.name}</span> <span class="muted">${k.zh}</span><p>想要 ${dishImg(c.dish, 1)} ${r.zh}</p><p class="muted">${n ? `库存 ${n} 份，可以上菜` : '还没有这道菜'}</p></div>${n ? `<button class="btn green" type="button" data-serve="${c.id}">接待</button>` : `<button class="btn ghost" type="button" data-gocook="${r.id}">去做菜</button>`}</article>`;
  }).join('') : `<div class="px empty">店里暂时没有客人，过一会儿就会有人进门。先去厨房备几道菜吧。</div>`;
  const dc = {}; S.dishes.forEach(d => { dc[d.id] = dc[d.id] || []; dc[d.id].push(d.q); });
  $('#stock').innerHTML = Object.keys(dc).length ? Object.entries(dc).map(([id, qs]) => `<span class="chip">${dishImg(id, 2)}${RECIPE[id].zh} <span class="num">×${qs.length}</span> 最好${Math.max(...qs)}星</span>`).join('') : '<span class="muted">还没有做好的菜。</span>';
  $('#earned').innerHTML = `累计收入 <span class="num">${S.stats.earned}</span>`;
}
function renderWords() {
  const all = entries(), open = all.filter(e => e.lv <= S.lv), done = open.filter(e => S.words[e.k]), three = open.filter(e => (S.words[e.k] || {}).b >= 85);
  $('#wSum').innerHTML = `<div><b>${done.length}</b><span>练过</span></div><div><b>${three.length}</b><span>三星</span></div><div><b>${open.length}</b><span>已解锁</span></div><button class="btn green" type="button" data-a="drill">${uiImg('mic')}快速练习 ×5（按星数给金币）</button>`;
  const F = [['all', '全部'], ['food', '食材'], ['verb', '动作'], ['sent', '句子'], ['talk', '待客']];
  $('#wFilter').innerHTML = F.map(([k, n]) => `<button type="button" data-f="${k}" aria-pressed="${WF === k}">${n}</button>`).join('');
  const list = open.filter(e => WF === 'all' || e.cat === WF);
  $('#wList').innerHTML = list.map(e => { const w = S.words[e.k]; return `<div class="wrow" data-w="${esc(e.k)}" role="button" tabindex="0"><div><div class="t" lang="en">${e.icon ? itemImg(e.icon, 2) : ''}${esc(e.en)}</div><div class="meta">${e.ipa ? `<span class="ipa">${esc(e.ipa)}</span> · ` : ''}${esc(e.zh)}${w ? ` · 练过 ${w.n} 次` : ''}</div></div><div class="row" style="gap:6px;flex-wrap:nowrap">${w ? starsHTML(starsOf(w.b), 2) : '<span class="tag">未练</span>'}<button class="btn blue" type="button" data-say="${esc(e.en)}" aria-label="听发音">${uiImg('spk')}</button></div></div>`; }).join('')
    + (all.length > open.length ? `<p class="locked-note">还有 ${all.length - open.length} 条会随等级解锁。</p>` : '');
}
function refresh() {
  if (!S) return;
  refreshHUD(); refreshBadges(); flushLv();
  if (VIEW === 'farm') { renderFarmStatus(); renderSetup(); renderQuests(); renderIntro(); }
  else if (VIEW === 'kitchen') renderKitchen();
  else if (VIEW === 'diner') renderDiner();
  else if (VIEW === 'words') renderWords();
}
let tipT = 0;
function tick() {
  const now = Date.now(), dt = Math.min(now - S.last, 3 * 864e5); S.last = now; simulate(dt);
  refreshHUD(); refreshBadges();
  if (VIEW === 'farm' && now - tipT > 1000) { tipT = now; renderFarmStatus(); }
  if (VIEW === 'diner' && S.cust.map(c => c.id + ':' + dishCount(c.dish)).join(',') !== custSig) renderDiner();
  if (S.q && S.q.day !== todayKey()) refresh();
  if (now % 10000 < 1000) save(false);
}

// ================= 启动 =================
let lastFrame = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - lastFrame < 33) return; lastFrame = t;
  if (VIEW === 'farm') drawFarm(t); else if (VIEW === 'diner') drawDiner(t);
  if (COOK) drawCook(t);
}
// 单独打开（GitHub Pages / githack）时：可安装到主屏幕，并用 Service Worker 离线缓存；在 claude.ai 里不启用
function setupPWA() {
  if (window.claude || !('serviceWorker' in navigator) || !window.isSecureContext || location.protocol === 'file:') return;
  [['manifest', 'manifest.webmanifest'], ['apple-touch-icon', 'icon-192.png']].forEach(([rel, href]) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.append(l); });
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
function onResize() {
  if (VIEW === 'farm') fitFarm(); if (VIEW === 'diner') fitDiner();
  if (COOK) { COOK.w = fitCanvas(COOK.cv, 84); COOK.ox = Math.floor((COOK.w - 160) / 2); }
}
function boot() {
  S = loadLocal() || newGame();
  simulate(Date.now() - S.last); S.last = Date.now(); ensureQuests();
  farmCv = $('#farmCv'); FG = farmCv.getContext('2d');
  dinerCv = $('#dinerCv'); DGc = dinerCv.getContext('2d');
  $('#ava').innerHTML = im('dd:farm:0', ddSpr('farm', 0), 2);
  $('#bShop').innerHTML = im('seedbag', seedBagSpr(), 2) + '种子店';
  $('#bBag').innerHTML = im('basket', basketSpr(), 2) + '仓库';
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button type="button" role="tab" data-v="${k}" aria-selected="${k === 'farm'}">${im('tab:' + k, tabSpr(k), 2)}<span>${n}</span><i class="badge" hidden></i></button>`).join('');
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { ac(); SFX.click(); go(b.dataset.v); } });
  farmCv.addEventListener('click', onFarmTap);
  dinerCv.addEventListener('click', onDinerTap);
  $('#bShop').onclick = () => { ac(); openShop(); };
  $('#bBag').onclick = () => { ac(); openBag(); };
  $('#bHarvest').onclick = () => { ac(); unlockVoice(); const ks = ripeKeys(); if (ks.length) { DD.hop = 1; harvest(ks); } };
  $('#bSet').onclick = () => { ac(); openSettings(); };
  $('#stage').addEventListener('click', e => {
    const t = e.target;
    const q = t.closest('[data-q]'); if (q) { const it = S.q.list[+q.dataset.q]; if (it.n >= it.goal && !it.done) { it.done = true; gainCoins(10 + it.goal * 4); gainXP(8); SFX.coin(); save(); refresh(); } return; }
    if (t.closest('[data-a=intro-x]')) { S.intro = false; save(); refresh(); return; }
    if (t.closest('[data-a=setup-go]')) { startSetup(); return; }
    if (t.closest('[data-a=setup-skip]')) { S.asrSkip = true; save(); refresh(); return; }
    const ck = t.closest('[data-cook]'); if (ck) { ac(); unlockVoice(); startCook(ck.dataset.cook); return; }
    const gc = t.closest('[data-gocook]'); if (gc) { go('kitchen'); return; }
    const sv = t.closest('[data-serve]'); if (sv) { ac(); unlockVoice(); serve(+sv.dataset.serve); return; }
    if (t.closest('[data-a=drill]')) { ac(); unlockVoice(); drill(); return; }
    const f = t.closest('[data-f]'); if (f) { WF = f.dataset.f; renderWords(); return; }
    const sy = t.closest('[data-say]'); if (sy) { say(sy.dataset.say); return; }
    const w = t.closest('[data-w]'); if (w) { const e2 = entries().find(x => x.k === w.dataset.w); if (e2) { ac(); unlockVoice(); practice([e2], '单句练习'); } }
  });
  $('#stage').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-w]')) { e.preventDefault(); e.target.click(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(false); pushCloud(true); } else tick(); });
  document.addEventListener('pointerdown', () => { ac(); unlockVoice(); }, { once: true, capture: true });
  let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(onResize, 120); });
  ASR.subs.add(() => { if (VIEW === 'farm') renderSetup(); });
  go('farm');
  loadVoicePack();
  if (asrSaved()) setTimeout(() => loadASR().catch(() => { }), 2500);
  setupPWA();
  setInterval(tick, 1000);
  requestAnimationFrame(frame);
  initCloud();
}
boot();
</script>
