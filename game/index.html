<title>豆豆的田园厨房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="豆豆田园">
<meta name="theme-color" content="#2b2230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* 竖屏单屏游戏：顶部状态条 / 中间场景（画布 + 像素面板）/ 底部四个页签。
   整个游戏是一个固定的像素世界（夜晚由画布里的真实时钟表现），所以只做一套配色。 */
:root{
  --ink:#2a2230; --ink2:#5a4c5e;
  --paper:#fbf1d9; --paper2:#f0deb6; --paper3:#ddc28e;
  --bg:#2b2230; --bg2:#33293a; --tab:#45384c;
  --leaf:#7cc35a; --leaf2:#3d8a3a; --gold:#f2c14e; --tomato:#e2453a; --sky:#8ccaf0; --rose:#ef8a7a;
  --ok:#bfe8a8; --mid:#ffe08a; --miss:#f6b8b0;
  --f-px:"Pixelify Sans","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",ui-monospace,monospace;
  --f-en:"Jersey 10","Pixelify Sans","PingFang SC","Noto Sans SC",ui-monospace,monospace;
  --f-zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --px-b:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;font-family:var(--f-px);font-size:15px;color:var(--paper);
  background-color:var(--bg);
  background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%),linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle}
.px{background:var(--paper);color:var(--ink);box-shadow:var(--px-b);margin:3px}
h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--ink2)}
.zh{font-family:var(--f-zh)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.btn{font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:var(--gold);border:0;padding:6px 12px;min-height:40px;margin:3px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:var(--px-b),inset 0 -3px 0 0 rgba(0,0,0,.18),inset 0 3px 0 0 rgba(255,255,255,.4)}
.btn:active{transform:translateY(2px);box-shadow:var(--px-b),inset 0 3px 0 0 rgba(0,0,0,.2)}
.btn:focus-visible,#tabs button:focus-visible{outline:3px solid #fff;outline-offset:5px}
.btn.green{background:var(--leaf)}.btn.blue{background:var(--sky)}.btn.red{background:var(--rose)}.btn.ghost{background:var(--paper2)}
.btn.sm{min-height:32px;padding:3px 9px;font-size:13px}
.btn:disabled{background:#cfc3ab;color:#837668;cursor:not-allowed;transform:none}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;color:var(--ink2)}

/* 顶部状态条 */
#hud{display:flex;align-items:center;gap:10px;padding:6px 10px}
.lvbox{flex:1;min-width:0;display:grid;gap:4px}
.lvline{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.xpbar{height:10px;background:var(--paper3);box-shadow:0 0 0 2px var(--ink);margin:0 2px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(var(--leaf) 55%,var(--leaf2) 55%);transition:width .3s steps(6)}
.coins{display:flex;align-items:center;gap:5px;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.coins.bump{animation:bump .35s steps(3)}
@keyframes bump{50%{transform:scale(1.25)}}

/* 场景与页面 */
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 3px 12px;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
.view{display:grid;gap:12px;align-content:start}
.scene-wrap{position:relative;line-height:0;background:#1a1420}
canvas.scene{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;line-height:1.2}
.float{position:absolute;transform:translate(-50%,-100%);font-weight:700;font-size:14px;color:#fff;white-space:nowrap;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink);animation:floatUp 1.2s steps(10) forwards}
.float.info{color:var(--mid)}
.float.say{background:var(--paper);color:var(--ink);text-shadow:none;padding:3px 7px;box-shadow:var(--px-b);font-size:13px;animation:sayIn 2.6s steps(6) forwards}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-100%)}to{opacity:0;transform:translate(-50%,-280%)}}
@keyframes sayIn{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}
.tip{margin:0;padding:0 4px;font-size:14px;color:var(--paper);line-height:1.4}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{flex:1}
.panel{padding:10px 12px;display:grid;gap:8px}
.panel h2{font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-size:12px;font-weight:400;color:var(--ink2)}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.qlist li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:14px}
.qbar{font-variant-numeric:tabular-nums;color:var(--ink2)}
.intro p{margin:0;font-family:var(--f-zh);font-size:14px;line-height:1.6}
.intro ol{margin:0;padding-left:20px;font-family:var(--f-zh);font-size:14px;line-height:1.7}
.vhead{padding:0 4px;display:grid;gap:4px}
.vhead h2{font-size:20px}
.vhead h2 span{font-family:var(--f-en);font-size:20px;font-weight:400;color:var(--gold);margin-left:6px}
.vhead p{margin:0;font-family:var(--f-zh);font-size:13px;color:#e6d8c0;line-height:1.5}
.cards{display:grid;gap:12px}

/* 菜谱卡片 */
.rc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px}
.rc h3{font-family:var(--f-en);font-weight:400;font-size:21px;line-height:1.05}
.rc .sub{font-size:13px;margin:2px 0 6px;font-family:var(--f-zh);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:13px;padding:1px 6px 1px 2px;background:var(--paper2);font-variant-numeric:tabular-nums}
.chip.lack{background:var(--miss)}
.rc-side{display:grid;justify-items:end;gap:4px;font-size:13px}
.price{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:15px}
.rc.locked{opacity:.6}
.rc.locked .btn{display:none}

/* 客人 */
.cc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px}
.cc p{margin:2px 0 0;font-size:14px}
.empty{padding:14px;font-family:var(--f-zh);font-size:14px;line-height:1.6}
.stock{display:flex;flex-wrap:wrap;gap:8px}

/* 词本 */
.wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.wsum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.wsum span{font-size:12px;color:var(--ink2)}
.wsum .btn{grid-column:1/-1}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px}
.filters .btn[aria-pressed=true]{background:var(--gold)}
.filters .btn{background:var(--paper2)}
.wlist{padding:4px 10px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--paper3)}
.wrow:last-child{border-bottom:0}
.wrow .en{font-family:var(--f-en);font-size:21px;line-height:1.1}
.wrow .meta{font-size:12px;color:var(--ink2);font-family:var(--f-zh);margin-top:2px}
.wrow .ipa{font-family:"Lucida Sans Unicode","Arial Unicode MS",system-ui,sans-serif;font-weight:400}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.locked-note{padding:6px 2px;font-size:12px;color:#e6d8c0;font-family:var(--f-zh)}

/* 底部页签 */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 3px 10px}
#tabs button{position:relative;font:inherit;font-size:13px;font-weight:600;color:var(--paper);background:var(--tab);border:0;cursor:pointer;
  display:grid;justify-items:center;gap:2px;padding:6px 0 5px;box-shadow:var(--px-b);margin:3px}
#tabs button[aria-selected=true]{background:var(--gold);color:var(--ink)}
.badge{position:absolute;top:-7px;right:2px;min-width:18px;height:18px;padding:0 4px;background:var(--tomato);color:#fff;font-size:12px;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--ink);font-style:normal}

/* 弹层 */
.layer{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(26,18,32,.66);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.layer.center{align-items:center}
.sheet{width:100%;max-width:460px;max-height:100%;overflow-y:auto;padding:14px;display:grid;gap:12px;align-content:start}
.layer.full .sheet{height:100%}
.sheet h3{font-size:18px}
.sheet .lead{margin:0;font-family:var(--f-zh);font-size:14px;line-height:1.55;color:var(--ink2)}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;background:var(--paper2)}
.li b{font-size:15px}
.li .meta{font-size:12px;color:var(--ink2);font-family:var(--f-zh)}
.li.off{opacity:.55}
.sec{font-size:13px;color:var(--ink2);margin:4px 0 -4px;letter-spacing:.06em}
.big{display:grid;justify-items:center;gap:8px;text-align:center;padding:6px 0}
.big h3{font-size:22px}
.big p{margin:0;font-family:var(--f-zh)}

/* 口语卡 */
.speak{display:grid;gap:10px;padding:12px;background:#fffaf0;box-shadow:inset 0 0 0 2px var(--paper3)}
.sp-en{font-family:var(--f-en);font-size:31px;line-height:1.2;color:var(--ink);-webkit-user-select:text;user-select:text}
.sp-en .w{display:inline-block;margin-right:.3em;padding:0 2px}
.sp-en .w.v{background:var(--mid);box-shadow:inset 0 -3px 0 0 #e0a830}
.sp-en .w.ok{background:var(--ok);box-shadow:none}
.sp-en .w.part{background:var(--mid);box-shadow:none}
.sp-en .w.cur{background:#bfe0ff;box-shadow:inset 0 -3px 0 0 #4a90d0}
.sp-en .w.miss{background:var(--miss);box-shadow:none;text-decoration:underline wavy #c0392b}
.sp-zh{font-family:var(--f-zh);font-size:14px;color:var(--ink2)}
.sp-row{display:flex;gap:8px;flex-wrap:wrap}
.sp-row .btn{white-space:nowrap}
.sp-row .mic{flex:1}
.mic.on{animation:pulse .7s steps(2) infinite}
@keyframes pulse{50%{background:#ffb0a0}}
.sp-heard:empty,.sp-res:empty{display:none}
.sp-heard{font-size:13px;color:var(--ink2);min-height:1.3em;font-family:var(--f-zh);-webkit-user-select:text;user-select:text}
.sp-res{display:flex;align-items:center;gap:8px;min-height:26px;font-weight:700}
.sp-dl,.sp-self{display:grid;gap:6px;font-family:var(--f-zh);font-size:13px;color:var(--ink2)}
.sp-dl p,.sp-self p{margin:0}

/* 做菜 */
.cook{display:grid;gap:10px;align-content:start}
.ck-top{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.ck-title b{display:block;font-family:var(--f-en);font-weight:400;font-size:22px;line-height:1.05}
.ck-title span{font-size:13px;color:var(--ink2);font-family:var(--f-zh)}
.pips{display:flex;gap:4px;grid-column:1/-1}
.pips i{flex:1;height:8px;background:var(--paper3)}
.pips i.done{background:var(--leaf)}
.pips i.now{background:var(--gold)}

/* 对话 */
.chat{display:grid;gap:8px}
.bub{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.bub .txt{padding:8px 10px;background:#fffaf0;box-shadow:inset 0 0 0 2px var(--paper3)}
.bub .txt p{margin:0}
.bub .txt .e{font-family:var(--f-en);font-size:22px;line-height:1.1}
.bub .txt .z{font-size:13px;color:var(--ink2);font-family:var(--f-zh);margin-top:2px}
.bub.me{grid-template-columns:1fr auto}
.bub.me .txt{background:#eaf6dc;box-shadow:inset 0 0 0 2px #b6d89a}
.bub .tag{font-size:12px;color:var(--ink2)}

#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(88vw,420px);pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:8px 12px;font-size:14px;box-shadow:0 -3px 0 0 var(--gold),0 3px 0 0 var(--gold),-3px 0 0 0 var(--gold),3px 0 0 0 var(--gold);font-family:var(--f-px);line-height:1.4;animation:sayIn 2.8s steps(6) forwards}
@media (prefers-reduced-motion:reduce){.float,.toast{animation-duration:.01s;animation-delay:2s}.mic.on{animation:none;background:#ffb0a0}.coins.bump{animation:none}}
@media (min-width:520px){.cards.two{grid-template-columns:1fr 1fr}}
</style>

<div id="app">
  <header id="hud" class="px">
    <span id="ava"></span>
    <div class="lvbox">
      <div class="lvline"><b id="lvText">Lv 1</b><span id="xpText">0 / 40</span></div>
      <div class="xpbar"><i id="xpFill"></i></div>
    </div>
    <div class="coins" id="coins"></div>
    <button class="btn ghost sm" id="bSet" type="button">设置</button>
  </header>

  <main id="stage">
    <section id="v-farm" class="view">
      <div class="scene-wrap px"><canvas id="farmCv" class="scene" width="160" height="150" aria-label="农场：点地块来播种、照料和收获"></canvas><div id="farmFx" class="fx"></div></div>
      <p id="farmTip" class="tip"></p>
      <div class="tools">
        <button class="btn" id="bShop" type="button"></button>
        <button class="btn ghost" id="bBag" type="button"></button>
      </div>
      <section class="px panel intro" id="intro" hidden></section>
      <section class="px panel" id="quests"></section>
    </section>

    <section id="v-kitchen" class="view" hidden>
      <div class="vhead"><h2>厨房<span>Kitchen</span></h2><p>用农场收获的食材做菜。每一步都要把英文步骤说出来，说得越好，菜的星级越高，卖得越贵。</p></div>
      <div id="recipes" class="cards two"></div>
    </section>

    <section id="v-diner" class="view" hidden>
      <div class="scene-wrap px"><canvas id="dinerCv" class="scene" width="160" height="96" aria-label="小馆：客人在柜台前等你接待"></canvas></div>
      <div class="vhead"><h2>小馆<span>Diner</span></h2><p>客人会用英语点菜、问价。你也要用英语回答，说得好还有小费。</p></div>
      <div id="custList" class="cards"></div>
      <section class="px panel"><h2>菜品库存 <small id="earned"></small></h2><div id="stock" class="stock"></div></section>
    </section>

    <section id="v-words" class="view" hidden>
      <div class="vhead"><h2>词本<span>Words</span></h2><p>游戏里出现过的单词和句子都收在这里，点喇叭听发音，点一行单独练习。</p></div>
      <section class="px panel wsum" id="wSum"></section>
      <div class="filters" id="wFilter"></div>
      <section class="px wlist" id="wList"></section>
    </section>
  </main>

  <nav id="tabs" role="tablist"></nav>
</div>
<div id="layers"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
// ================= 色板与像素绘图工具 =================
const C = {
  ink:'#2a2230', white:'#fff8ea',
  grass:'#7cc35a', grass2:'#62ad4a', grass3:'#9ad66e', grassDk:'#3f7f3a',
  soil:'#a26a42', soil2:'#86552f', soilEdge:'#5a3622', wet:'#6e4329', wet2:'#58341f',
  leaf:'#5fb34a', leaf2:'#3d8a3a', leafHi:'#9ee070', stem:'#5a8a34',
  tomato:'#e2453a', tomato2:'#a82c2c', carrot:'#f08a2a', carrot2:'#c8641e',
  potato:'#d0aa70', potato2:'#9c7a48', corn:'#f6d54a', corn2:'#d8a42a', husk:'#b4d070',
  onion:'#efe0ea', onion2:'#b07aa8', berry:'#e8384f', berry2:'#a01e36',
  pumpkin:'#f2902e', pumpkin2:'#c0601a', egg:'#fbefd6', egg2:'#e0c8a0',
  wood:'#b07848', wood2:'#7a4e2e', wood3:'#d8a070', roof:'#c94a3a', roof2:'#8e2e2a',
  tofu:'#faefd9', tofu2:'#e3cfa8', tofuTop:'#fffaf0', limb:'#d9c49b', blush:'#f2a2a0', scal:'#78ad48', scal2:'#4e7f2e',
  water:'#8ad4f6', water2:'#3a8ed0', gold:'#f2c14e', gold2:'#c88a1e', steel:'#c8d0dc', steel2:'#8a94a6', dark:'#3a3440',
};
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
function P(g, x, y, col) { g.fillStyle = col; g.fillRect(Math.floor(x), Math.floor(y), 1, 1); }
function R(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function E(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry); y++)
    for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx); x++) {

      if (dx * dx + dy * dy <= 1) g.fillRect(x, y, 1, 1);
    }
}
// Bresenham 线，w = 方形笔宽
function L(g, x0, y0, x1, y1, col, w = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, o = Math.floor((w - 1) / 2);
  let e = dx + dy; g.fillStyle = col;
  for (;;) {
    g.fillRect(x0 - o, y0 - o, w, w);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function mat(g, x, y, rows, map) { rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== '.' && map[ch]) P(g, x + i, y + j, map[ch]); })); }
// 自动描边：透明像素若四邻有实像素 → 墨色
function outline(c, col = C.ink) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h).data, a = i => d[i * 4 + 3] > 0, add = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (a(i)) continue;
    if ((x > 0 && a(i - 1)) || (x < w - 1 && a(i + 1)) || (y > 0 && a(i - w)) || (y < h - 1 && a(i + w))) add.push(i);
  }

const growMs = id => CROPS[id].grow * 1000;

function simulate(dt) {
  if (!(dt > 0)) return;
  const n = Math.max(1, Math.min(Math.round(dt / 1000), 7200)), per = dt / n, pr = Math.min(1, per / 1000);
  for (let s = 0; s < n; s++) {
    for (const p of S.plots) {
      if (!p.open || !p.crop || p.dead) continue;
      const G = growMs(p.crop);
      if (p.prog >= G) { p.dry = false; continue; }
      p.prog = Math.min(G, p.prog + per * plotRate(p));
      if (p.prog >= G) { p.dry = false; continue; }
      if (!p.dry && Math.random() < pr / 45) p.dry = true;
      if (p.weeds < 2 && Math.random() < pr / 70) p.weeds++;
      if (p.bugs < 2 && Math.random() < pr / 90) p.bugs++;

    S.nest.timer += per;
    while (S.nest.timer >= EGG_MS) { S.nest.timer -= EGG_MS; if (S.nest.eggs < 3) S.nest.eggs++; }
    S.custTimer -= per;

}

  Object.entries(VERB_INFO).forEach(([w, [ipa, zh]]) => push({ k: w, en: w, zh, ipa, cat: 'verb', lv: vlv[w] || 1 }));

function drill() {
  const pool = entries().filter(e => e.lv <= S.lv), pickd = [];
  const weight = e => 110 - ((S.words[e.k] || {}).b || 0);
  while (pickd.length < 5 && pickd.length < pool.length) {
    const rest = pool.filter(e => !pickd.includes(e)), tot = rest.reduce((a, e) => a + weight(e), 0); let x = Math.random() * tot;
    for (const e of rest) { x -= weight(e); if (x <= 0) { pickd.push(e); break; } }
  }

  const iv = setInterval(draw, 1000);
  draw();
  node.addEventListener('click', e => {
    const t = e.target.closest('[data-t]'); if (t) { S.cfg[t.dataset.t] = !S.cfg[t.dataset.t]; save(); draw(); return; }
    if (e.target.closest('[data-m]')) { const ks = Object.keys(MODES); S.cfg.mode = ks[(ks.indexOf(S.cfg.mode) + 1) % ks.length]; save(); draw(); return; }
    if (e.target.closest('[data-a=asr]')) { loadASR().then(() => toast('离线识别准备好了'), () => toast('离线识别没准备好：' + asrErrText())).finally(draw); draw(); return; }
    if (e.target.closest('[data-a=asrdel]')) { try { if (ASR.model) ASR.model.terminate(); } catch (er) { } Object.assign(ASR, { model: null, loading: null, state: 'none' }); try { localStorage.removeItem(ASR_KEY); indexedDB.deleteDatabase('/vosk'); } catch (er) { } toast('已删除离线识别模型'); draw(); return; }
    if (e.target.closest('[data-a=reset]')) { node.querySelector('[data-confirm]').hidden = false; return; }
    if (e.target.closest('[data-a=yes]')) { S = newGame(); S.intro = false; save(); L.close(); toast('已经重新开始'); return; }
    if (e.target.closest('[data-a=x]')) L.close();
  });
}
const LVQ = [];
function levelUp(lv) { LVQ.push(lv); if (document.querySelector('.layer')) toast(`升到 Lv ${lv} 啦！`); setTimeout(flushLv, 350); }
function flushLv() { if (LVQ.length && !document.querySelector('.layer')) showLv(LVQ.shift()); }
function showLv(lv) {
  const crops = CROP_IDS.filter(id => CROPS[id].lv === lv), recs = RECIPES.filter(r => r.lv === lv), plots = Object.keys(PLOT_LOCK).filter(k => PLOT_LOCK[k].lv === lv);
  {
    SFX.lvl();
    const node = h(`<div class="big"><p class="eyebrow">LEVEL UP</p><h3>升到 Lv ${lv} 啦！</h3>
      ${crops.length || recs.length || plots.length ? `<p>新解锁：</p><div class="chips" style="justify-content:center">${crops.map(id => `<span class="chip">${itemImg(id, 2)}${CROPS[id].zh}种子</span>`).join('')}${recs.map(r => `<span class="chip">${dishImg(r.id, 2)}${r.zh}</span>`).join('')}${plots.map(() => `<span class="chip">${im('lock', lockSpr(), 2)}可开垦新地</span>`).join('')}</div>` : '<p>继续加油！</p>'}
      <button class="btn green" type="button">太好了</button></div>`);
    const L = openLayer(node, { center: true }); node.querySelector('button').onclick = () => L.close();
  }
}

// ================= 页面渲染 =================
let VIEW = 'farm';
const TABS = [['farm', '农场'], ['kitchen', '厨房'], ['diner', '小馆'], ['words', '词本']];
function go(v) {
  VIEW = v; TABS.forEach(([k]) => { $('#v-' + k).hidden = k !== v; $(`#tabs [data-v=${k}]`).setAttribute('aria-selected', k === v); });
  $('#stage').scrollTop = 0; refresh();
}
function refreshHUD() {
  $('#lvText').textContent = 'Lv ' + S.lv;
  const a = lvNeed(S.lv - 1), b = lvNeed(S.lv); $('#xpText').textContent = `${S.xp - a} / ${b - a} XP`; $('#xpFill').style.width = Math.min(100, (S.xp - a) / (b - a) * 100) + '%';
  $('#coins').innerHTML = uiImg('coin', 3) + S.coins;
}
function refreshBadges() {
  const ck = RECIPES.filter(r => r.lv <= S.lv && canCook(r)).length, sv = S.cust.filter(c => dishCount(c.dish) > 0).length;
  [['kitchen', ck], ['diner', sv || 0]].forEach(([k, n]) => { const b = $(`#tabs [data-v=${k}] .badge`); b.hidden = !n; b.textContent = n; });
  const ripe = S.plots.filter(p => p.open && p.crop && p.prog >= growMs(p.crop)).length; const fb = $('#tabs [data-v=farm] .badge'); fb.hidden = !ripe; fb.textContent = ripe;
}
function farmTip() {
  const P0 = S.plots.filter(p => p.open);
  const ripe = P0.filter(p => p.crop && p.prog >= growMs(p.crop)).length, care = P0.filter(p => p.crop && (p.bugs || p.weeds || (p.dry && p.prog < growMs(p.crop)))).length, empty = P0.filter(p => !p.crop && !p.dead).length, dead = P0.filter(p => p.dead).length;
  const grow = P0.filter(p => p.crop && p.prog < growMs(p.crop)).map(p => ({ id: p.crop, s: (growMs(p.crop) - p.prog) / plotRate(p) / 1000 })).sort((a, b) => a.s - b.s)[0];
  const bits = [];
  if (ripe) bits.push(`${ripe} 块地可以收获`);
  if (care) bits.push(`${care} 块需要照料（虫子、杂草、缺水会拖慢生长）`);
  if (dead) bits.push(`${dead} 块枯苗要清理`);
  if (empty) bits.push(`${empty} 块空地可以播种`);
  if (!bits.length && grow) bits.push(`下一批：${CROPS[grow.id].zh} ${fmtT(grow.s)} 后成熟`);
  if (S.nest.eggs) bits.push(`鸡窝里有 ${S.nest.eggs} 个蛋`);
  $('#farmTip').textContent = bits.length ? '点地块：' + bits.join('；') + '。' : '地都种满了，去厨房看看吧。';
}
function renderQuests() {
  ensureQuests();
  $('#quests').innerHTML = `<h2>今日任务 <small>每天零点刷新</small></h2><ul class="qlist">${S.q.list.map((q, i) => `<li><span>${QDEF[q.id].zh}</span><span class="qbar">${q.n}/${q.goal}</span>${q.done ? '<span class="qbar">已领</span>' : `<button class="btn sm${q.n >= q.goal ? ' green' : ''}" type="button" data-q="${i}"${q.n >= q.goal ? '' : ' disabled'}>${uiImg('coin')}${10 + q.goal * 4}</button>`}</li>`).join('')}</ul>`;
}
function renderIntro() {
  const el = $('#intro'); el.hidden = !S.intro; if (!S.intro) return;
  el.innerHTML = `<h2>玩法 <button class="btn ghost sm" type="button" data-a="intro-x">知道了</button></h2><ol>
    <li>在农场点地块：播种、捉虫、除草、浇水、收获。收获时跟读一句英文，说得好多拿作物。</li>
    <li>去厨房用食材做菜。每一步都要说出英文做法，平均星级决定菜的品质和价格。</li>
    <li>在小馆接待客人：听懂点单，用英语回答、报价，口语好还有小费。</li></ol>
    <p class="muted">每句英文都有「正常」和「逐词慢读」两种示范。第一次点「说」会请求麦克风权限，并提示下载约 40MB 的离线识别模型，之后断网也能用。</p>`;
}
function renderKitchen() {
  $('#recipes').innerHTML = RECIPES.map(r => {
    const lock = r.lv > S.lv, ok = canCook(r), n = dishCount(r.id);
    return `<article class="rc px${lock ? ' locked' : ''}">${dishImg(r.id, 3)}<div><h3 lang="en">${esc(r.en)}</h3><p class="sub">${r.zh} · ${r.steps.length} 句英文</p><div class="chips">${Object.entries(r.need).map(([k, m]) => `<span class="chip${(S.inv[k] || 0) < m ? ' lack' : ''}">${itemImg(k, 2)}${S.inv[k] || 0}/${m}</span>`).join('')}</div></div>
      <div class="rc-side">${coinHTML(r.price)}${lock ? `<span>Lv ${r.lv} 解锁</span>` : `<span>库存 ${n}</span>`}<button class="btn sm ${ok ? 'green' : 'ghost'}" type="button" data-cook="${r.id}"${ok ? '' : ' disabled'}>${ok ? '做菜' : '缺食材'}</button></div></article>`;
  }).join('');
}
let custSig = '';
function renderDiner() {
  custSig = S.cust.map(c => c.id + ':' + dishCount(c.dish)).join(',');
  $('#custList').innerHTML = S.cust.length ? S.cust.map(c => {
    const k = CRITTERS[c.who], r = RECIPE[c.dish], n = dishCount(c.dish);
    return `<article class="cc px">${critImg(c.who, 2)}<div><b>${k.name}</b> <span class="muted">${k.zh}</span><p>想要 ${dishImg(c.dish, 1)} ${r.zh}</p><p class="muted">${n ? `库存 ${n} 份，可以上菜` : '还没有这道菜'}</p></div>${n ? `<button class="btn green" type="button" data-serve="${c.id}">接待</button>` : `<button class="btn ghost sm" type="button" data-gocook="${r.id}">去做菜</button>`}</article>`;
  }).join('') : `<div class="px empty">店里暂时没有客人，过一会儿就会有人进门。先去厨房备几道菜吧。</div>`;
  const dc = {}; S.dishes.forEach(d => { dc[d.id] = (dc[d.id] || 0) + 1; });
  $('#stock').innerHTML = Object.keys(dc).length ? Object.entries(dc).map(([id, n]) => `<span class="chip">${dishImg(id, 2)}${RECIPE[id].zh} ×${n}</span>`).join('') : '<span class="muted zh">还没有做好的菜。</span>';
  $('#earned').textContent = `累计收入 ${S.stats.earned}`;
}
function renderWords() {
  const all = entries(), open = all.filter(e => e.lv <= S.lv), done = open.filter(e => S.words[e.k]), three = open.filter(e => (S.words[e.k] || {}).b >= 85);
  $('#wSum').innerHTML = `<div><b>${done.length}</b><span>练过</span></div><div><b>${three.length}</b><span>三星</span></div><div><b>${open.length}</b><span>已解锁</span></div><button class="btn green" type="button" data-a="drill">${uiImg('mic')}快速练习 ×5（按星数给金币）</button>`;
  const F = [['all', '全部'], ['food', '食材'], ['verb', '动作'], ['sent', '句子'], ['talk', '待客']];
  $('#wFilter').innerHTML = F.map(([k, n]) => `<button class="btn sm" type="button" data-f="${k}" aria-pressed="${WF === k}">${n}</button>`).join('');
  const list = open.filter(e => WF === 'all' || e.cat === WF);
  $('#wList').innerHTML = list.map(e => { const w = S.words[e.k]; return `<div class="wrow" data-w="${esc(e.k)}" role="button" tabindex="0"><div><div class="en" lang="en">${e.icon ? itemImg(e.icon, 2) + ' ' : ''}${esc(e.en)}</div><div class="meta">${e.ipa ? `<span class="ipa">${esc(e.ipa)}</span> · ` : ''}${esc(e.zh)}${w ? ` · 练过 ${w.n} 次` : ''}</div></div><div class="row" style="gap:4px;flex-wrap:nowrap">${starsHTML(w ? starsOf(w.b) : 0, 2)}<button class="btn blue sm" type="button" data-say="${esc(e.en)}" aria-label="听发音">${uiImg('spk')}</button></div></div>`; }).join('')
    + (all.length > open.length ? `<p class="locked-note muted">还有 ${all.length - open.length} 条会随等级解锁。</p>` : '');
}
function refresh() {
  if (!S) return;
  refreshHUD(); refreshBadges(); flushLv();
  if (VIEW === 'farm') { farmTip(); renderQuests(); renderIntro(); }
  else if (VIEW === 'kitchen') renderKitchen();
  else if (VIEW === 'diner') renderDiner();
  else if (VIEW === 'words') renderWords();
}
let tipT = 0;
function tick() {
  const now = Date.now(), dt = Math.min(now - S.last, 3 * 864e5); S.last = now; simulate(dt);
  refreshHUD(); refreshBadges();
  if (VIEW === 'farm' && now - tipT > 1000) { tipT = now; farmTip(); }
  if (VIEW === 'diner' && S.cust.map(c => c.id + ':' + dishCount(c.dish)).join(',') !== custSig) renderDiner();
  if (S.q && S.q.day !== todayKey()) refresh();
  if (now % 10000 < 1000) save(false);
}

// ================= 启动 =================
let lastFrame = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - lastFrame < 33) return; lastFrame = t;
  if (VIEW === 'farm') drawFarm(t); else if (VIEW === 'diner') drawDiner(t);
  if (COOK) drawCook(t);
}
// 单独打开（GitHub Pages / githack）时：可安装到主屏幕，并用 Service Worker 离线缓存；在 claude.ai 里不启用
function setupPWA() {
  if (window.claude || !('serviceWorker' in navigator) || !window.isSecureContext || location.protocol === 'file:') return;
  [['manifest', 'manifest.webmanifest'], ['apple-touch-icon', 'icon-192.png']].forEach(([rel, href]) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.append(l); });
  navigator.serviceWorker.register('sw.js').catch(() => { });
  // 英文学习文本用的字体首屏用不到，主动加载一次，让离线缓存也存上
  if (document.fonts) document.fonts.load('20px "Jersey 10"').catch(() => { });
}
function boot() {
  S = loadLocal() || newGame();
  simulate(Date.now() - S.last); S.last = Date.now(); ensureQuests();
  farmCv = $('#farmCv'); FG = farmCv.getContext('2d'); FG.imageSmoothingEnabled = false;
  dinerCv = $('#dinerCv'); DGc = dinerCv.getContext('2d'); DGc.imageSmoothingEnabled = false;
  $('#ava').innerHTML = im('dd:farm:0', ddSpr('farm', 0), 2);
  $('#bShop').innerHTML = im('seedbag', seedBagSpr(), 2) + '种子店';
  $('#bBag').innerHTML = im('basket', basketSpr(), 2) + '仓库';
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button type="button" role="tab" data-v="${k}" aria-selected="${k === 'farm'}">${im('tab:' + k, tabSpr(k), 2)}<span>${n}</span><i class="badge" hidden></i></button>`).join('');
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { ac(); SFX.click(); go(b.dataset.v); } });
  farmCv.addEventListener('click', onFarmTap);
  $('#bShop').onclick = () => { ac(); openShop(); };
  $('#bBag').onclick = () => { ac(); openBag(); };
  $('#bSet').onclick = () => { ac(); openSettings(); };
  $('#stage').addEventListener('click', e => {
    const t = e.target;
    const q = t.closest('[data-q]'); if (q) { const it = S.q.list[+q.dataset.q]; if (it.n >= it.goal && !it.done) { it.done = true; gainCoins(10 + it.goal * 4); gainXP(8); SFX.coin(); save(); refresh(); } return; }
    if (t.closest('[data-a=intro-x]')) { S.intro = false; save(); refresh(); return; }
    const ck = t.closest('[data-cook]'); if (ck) { ac(); startCook(ck.dataset.cook); return; }
    const gc = t.closest('[data-gocook]'); if (gc) { go('kitchen'); return; }
    const sv = t.closest('[data-serve]'); if (sv) { ac(); serve(+sv.dataset.serve); return; }
    if (t.closest('[data-a=drill]')) { ac(); drill(); return; }
    const f = t.closest('[data-f]'); if (f) { WF = f.dataset.f; renderWords(); return; }
    const sy = t.closest('[data-say]'); if (sy) { say(sy.dataset.say); return; }
    const w = t.closest('[data-w]'); if (w) { const e2 = entries().find(x => x.k === w.dataset.w); if (e2) { ac(); practice([e2], '单句练习'); } }
  });
  $('#stage').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-w]')) { e.preventDefault(); e.target.click(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(false); pushCloud(true); } else tick(); });
  document.addEventListener('pointerdown', () => { ac(); unlockVoice(); }, { once: true, capture: true });
  go('farm');
  loadVoicePack();
  if (asrSaved()) setTimeout(() => loadASR().catch(() => { }), 2500);
  setupPWA();
  setInterval(tick, 1000);
  requestAnimationFrame(frame);
  initCloud();
}
boot();
</script>
